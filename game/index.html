<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLMERE — The Glassline Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js"}}
</script>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud">
  <div class="mission">
    <div class="mission-title">THE GLASSLINE RUN</div>
    <div class="mission-obj" id="objective">Lose the Harbor Patrol</div>
  </div>
  <div class="place" id="place">MARINA QUARTER</div>
  <div class="stats">
    <span id="clock">19:42</span>
    <span class="money">$12,500</span>
    <span class="stars" id="stars">★★☆☆☆</span>
  </div>
  <div class="map-wrap"><canvas id="minimap" width="150" height="150"></canvas></div>
  <div class="speed" id="speed"><span id="speed-val">084</span><span class="unit">KM/H</span></div>
  <div class="busted" id="busted">BUSTED</div>
  <div class="patrol" id="patrol"></div>
  <div class="prompt" id="prompt"></div>
  <div class="hint" id="hint">WASD drive &nbsp;·&nbsp; E enter car &nbsp;·&nbsp; F on foot</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
